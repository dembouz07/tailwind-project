<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ajouter un projet | Groupe 1 AWS re/Start</title>
        <link rel="icon" type="image/x-icon" href="public/favicon.ico" />
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 min-h-screen flex flex-col">

        <!-- ===== NAVBAR ===== -->
        <nav class="bg-gray-800 shadow-md border-b-2 border-blue-600 h-20 overflow-hidden">
            <div class="container mx-auto px-4 h-full flex items-center justify-between">

                <!-- Logo -->
                <a href="../../index.html" class="text-2xl font-bold text-blue-600">
                    <img src="../../public/logo.png" alt="Logo" class="h-32 inline-block" />
                </a>

                <!-- Menu -->
                <ul class="flex items-center space-x-6">
                    <li>
                        <a href="../../index.html"
                            class="text-blue-600 hover:text-blue-800 font-medium">
                            <i class="fas fa-house mr-1"></i> Accueil
                        </a>
                    </li>
                    <li>
                        <a href="projects.html"
                            class="text-blue-600 hover:text-blue-800 font-medium">
                            <i class="fas fa-briefcase mr-1"></i> Projets
                        </a>
                    </li>
                </ul>

                <!-- Bouton -->
                <button class="cursor-pointer rounded-full bg-blue-600 text-white font-semibold hover:bg-blue-700 px-3 py-2 transition">
                    <i class="fas fa-phone text-white"></i>
                    <a href="../contact.html" class="text-white"> Contactez-nous</a>
                </button>

            </div>
        </nav>

        <!-- ===== CONTENU PRINCIPAL ===== -->
        <main class="flex-1 bg-gray-50 py-20">
            <div class="container mx-auto px-6 max-w-2xl">

                <!-- Bouton retour -->
                <a href="projects.html"
                    class="inline-flex items-center text-blue-600 hover:text-blue-800 font-medium mb-8 transition">
                    <i class="fas fa-arrow-left mr-2"></i> Retour aux projets
                </a>

                <!-- Carte formulaire -->
                <div class="bg-white rounded-2xl shadow-md overflow-hidden">

                    <!-- En-tête de la carte -->
                    <div class="bg-gray-800 px-8 py-6">
                        <div class="flex items-center gap-3 mb-1">
                            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-plus text-white text-sm"></i>
                            </div>
                            <div>
                                <p class="text-blue-400 text-xs font-semibold uppercase tracking-widest">Nouveau</p>
                                <h1 class="text-white text-2xl font-bold">Ajouter un projet</h1>
                            </div>
                        </div>
                    </div>

                    <!-- Formulaire -->
                    <div class="p-8">
                        <form action="#" method="POST" class="space-y-6">

                            <!-- Titre -->
                            <div>
                                <label class="block text-gray-700 font-semibold text-sm mb-2">
                                    <i class="fas fa-heading text-blue-500 mr-2"></i>Titre du projet
                                </label>
                                <input type="text" name="titre"
                                    class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-gray-50"
                                    placeholder="Ex : Application de gestion des étudiants" required>
                            </div>

                            <!-- Description -->
                            <div>
                                <label class="block text-gray-700 font-semibold text-sm mb-2">
                                    <i class="fas fa-align-left text-blue-500 mr-2"></i>Description
                                </label>
                                <textarea name="description" rows="4"
                                    class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-gray-50 resize-none"
                                    placeholder="Décrivez brièvement le projet, ses objectifs et les technologies utilisées..." required></textarea>
                            </div>

                            <!-- Lien GitHub -->
                            <div>
                                <label class="block text-gray-700 font-semibold text-sm mb-2">
                                    <i class="fab fa-github text-blue-500 mr-2"></i>Lien du projet
                                </label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                                        <i class="fas fa-link text-sm"></i>
                                    </span>
                                    <input type="url" name="lien"
                                        class="w-full border border-gray-200 rounded-xl pl-10 pr-4 py-3 text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-gray-50"
                                        placeholder="https://github.com/...">
                                </div>
                            </div>

                            <!-- Image -->
                            <div>
                                <label class="block text-gray-700 font-semibold text-sm mb-2">
                                    <i class="fas fa-image text-blue-500 mr-2"></i>Image du projet
                                </label>
                                <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer bg-gray-50 hover:bg-blue-50 hover:border-blue-400 transition group">
                                    <div class="flex flex-col items-center gap-2 text-gray-400 group-hover:text-blue-500 transition">
                                        <i class="fas fa-cloud-upload-alt text-3xl"></i>
                                        <span class="text-sm font-medium">Cliquez pour importer une image</span>
                                        <span class="text-xs text-gray-400">PNG, JPG, GIF jusqu'à 10MB</span>
                                    </div>
                                    <input type="file" name="image" accept="image/*" class="hidden">
                                </label>
                            </div>

                            <!-- Séparateur -->
                            <div class="border-t border-gray-100 pt-2"></div>

                            <!-- Bouton submit -->
                            <button type="submit"
                                class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 active:scale-95 transition flex items-center justify-center gap-2 shadow-md shadow-blue-200">
                                <i class="fas fa-plus"></i>
                                Ajouter le projet
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </main>

        <!-- ===== FOOTER ===== -->
        <footer>
            <div class="bg-gray-800 text-white py-12">
                <div class="container mx-auto px-6 text-center">
                    <h2 class="text-2xl font-bold mb-4">Groupe 1 AWS re/Start</h2>
                    <p class="text-gray-400 mb-6">
                        © 2026 Groupe 1 AWS re/Start. Tous droits réservés.
                    </p>
                    <div class="flex justify-center space-x-6">
                        <a href="#" class="text-gray-400 hover:text-white transition">
                            <i class="fab fa-aws"></i>
                        </a>
                        <a href="#" class="text-gray-400 hover:text-white transition">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="#" class="text-gray-400 hover:text-white transition">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                    </div>
                </div>
            </div>
        </footer>

    </body>
</html>
