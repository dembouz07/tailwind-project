<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Groupe 1 AWS re/Start</title>
        <link rel="icon" type="image/x-icon" href="public/favicon.ico" />
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link href="../../src/output.css" rel="stylesheet" />
    </head>
    <body class="bg-gray-100">
        <nav
            class="bg-gray-800 shadow-md border-b-2 border-blue-600 h-20 overflow-hidden">
            <div
                class="container mx-auto px-4 h-full flex items-center justify-between">

                <!-- Logo -->
                <a href="../../index.html"
                    class="text-2xl font-bold text-blue-600">
                    <img src="../../public/logo.png" alt="Logo"
                        class="h-32 inline-block" />
                </a>

                <!-- Menu -->
                <ul class="flex items-center space-x-6">
                    <li>
                        <a href="../../index.html"
                            class="text-blue-600 hover:text-blue-800 font-medium">
                            <i class="fas fa-house mr-1"></i> Accueil
                        </a>
                    </li>
                    <li>
                        <a href="projects.html"
                            class="text-blue-600 hover:text-blue-800 font-medium">
                            <i class="fas fa-briefcase mr-1"></i> Projets
                        </a>
                    </li>
                </ul>

                <!-- Bouton -->
                <button
                    class="cursor-pointer rounded-full bg-blue-600 text-white font-semibold hover:bg-blue-700 px-3 py-2 transition">
                    <i class="fas fa-phone text-white"></i><a
                        href="../contact.html" class="text-white">
                        Contactez-nous</a>
                </button>

            </div>
        </nav>

<!-- Section Ajout de projet -->
<div class="flex justify-center items-center mt-10 px-4">
    <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-lg">
        
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">
            Ajouter un projet
        </h2>

        <form action="#" method="POST" class="space-y-4">

            <!-- Titre -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Titre</label>
                <input type="text" name="titre"
                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="Nom du projet" required>
            </div>

            <!-- Description -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Description</label>
                <textarea name="description"
                    class="w-full border border-gray-300 rounded-lg p-2 h-24 focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="Décrire le projet" required></textarea>
            </div>

            <!-- Lien -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Lien</label>
                <input type="url" name="lien"
                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="Lien GitHub ou site">
            </div>

            <!-- Image -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Image</label>
                <input type="file" name="image"
                    class="w-full border border-gray-300 rounded-lg p-2">
            </div>
            
            <!-- Bouton -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition mt-4">
                Ajouter le projet
            </button>
    </div>
</div>
       <footer>
      <div class="bg-gray-800 text-white py-12">
        <div class="container mx-auto px-6 text-center">
          <h2 class="text-2xl font-bold mb-4">Groupe 1 AWS re/Start</h2>
          <p class="text-gray-400 mb-6">
            © 2026 Groupe 1 AWS re/Start. Tous droits réservés.
          </p>
          <div class="flex justify-center space-x-6">
            <a href="#" class="text-gray-400 hover:text-white transition">
              <i class="fab fab fa-aws"></i>
            </a>
            <a href="#" class="text-gray-400 hover:text-white transition">
              <i class="fab fab fa-github"></i>
            </a>
            <a href="#" class="text-gray-400 hover:text-white transition">
              <i class="fab fa-linkedin-in"></i>
            </a>
          </div>
        </div>
    </footer>
  </body>
</html>
